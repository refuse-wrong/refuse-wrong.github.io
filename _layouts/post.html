---
layout: default
---
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">

<style>
  /* 全局背景设置 - 与首页保持一致 */
  body { 
    margin: 0;
    /* 请确保这里的 URL 与 index.html 中的图片一致 */
    background-image: url('{{ "/assets/images/wallhaven.jpg" | relative_url }}'); /* 替换为你的图片URL */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  /* 背景遮罩层 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.01); /* 半透明白色层 */
    backdrop-filter: blur(5px); /* 背景模糊 */
    z-index: -1;
  }

  /* 响应式布局容器 - 增加半透明感 */
  .post-container {
    max-width: 850px; /* 稍微调宽一点点，更有呼吸感 */
    margin: 40px auto;
    padding: 50px; /* 增加内边距 */
    background: rgba(255, 255, 255, 0.9); /* 容器半透明 */
    font-family: 'Noto Serif SC', serif;
    color: #333;
    line-height: 1.8;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    position: relative;
    z-index: 0;
  }

  /* 标题样式 */
  .post-header {
    margin-bottom: 50px;
    text-align: center;
    border-bottom: 1px solid #eee;
    padding-bottom: 30px;
  }

  .post-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 3rem;
    color: #2c3e50;
    margin-bottom: 15px;
    letter-spacing: 1px;
  }

  .post-meta {
    color: #999;
    font-size: 0.95rem;
    letter-spacing: 1px;
  }

  /* 正文排版 */
  .post-content {
    font-size: 1.15rem;
    text-align: justify;
  }

  /* 代码块样式优化 */
  .post-content pre {
    background: #f8f9fa;
    padding: 20px;
    overflow: auto;
    border-radius: 12px;
    border: 1px solid #eaedf0;
    line-height: 1.5;
    margin: 30px 0;
    font-family: "SFMono-Regular", Consolas, monospace;
    box-shadow: inset 0 1px 5px rgba(0,0,0,0.02);
  }

  .post-content pre code {
    background: transparent;
    padding: 0;
    font-size: 0.95rem;
    color: #24292e;
    white-space: pre;
  }

  /* 行内代码 */
  .post-content :not(pre) > code {
    background-color: rgba(230, 126, 34, 0.1); /* 淡淡的橙色背景，呼应主题 */
    color: #e67e22;
    padding: 0.2em 0.4em;
    border-radius: 4px;
    font-size: 90%;
  }

  /* ============================
     新增：表格样式优化
     ============================ */
  .table-wrapper {
    max-width: 100%;
    margin: 30px 0;
    overflow-x: auto;
  }

  .post-content table {
    width: 100%;
    border-collapse: collapse; /* 关键：显示边框 */
    border-spacing: 0;
    white-space: nowrap;
  }

  .post-content table th,
  .post-content table td {
    border: 1px solid #eaedf0; /* 边框颜色 */
    padding: 12px 15px;
  }

  .post-content table th {
    background-color: #f8f9fa;
    font-weight: 600;
    color: #2c3e50;
  }

  .post-content table tr:nth-child(even) {
    background-color: #fcfcfc;
  }

  .post-content table tr:hover {
    background-color: rgba(230, 126, 34, 0.05);
  }

  /* 响应式：针对移动端 */
  @media (max-width: 600px) {
    .post-container {
      margin: 10px auto;
      padding: 20px;
      border-radius: 0; /* 手机端取消圆角，节省空间 */
    }
    .post-title { font-size: 2rem; }
    .post-content { font-size: 1.1rem; }
  }

  .comments-wrapper {
    margin-top: 80px;
    padding-top: 40px;
    border-top: 2px dashed #eee;
  }
</style>

<div class="post-container">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <div class="post-meta">
      📅 发布于 {{ page.date | date: "%Y年 %m月 %d日" }}
    </div>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

  <div class="comments-wrapper">
    <h3 style="font-family: 'ZCOOL XiaoWei', serif; color: #2c3e50; margin-bottom: 30px; display: flex; align-items: center;">
      <span style="margin-right: 10px;">💬</span> 评论互动
    </h3>
    
    <script src="https://giscus.app/client.js"
            data-repo="refuse-wrong/refuse-wrong.github.io"
            data-repo-id="R_kgDOQ6RRWg"
            data-category="Announcements"
            data-category-id="DIC_kwDOQ6RRWs4C0-6k"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="light"
            data-lang="zh-CN"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</div>

<script>
  MathJax = {
    tex: {
      // 关键设置：允许使用单美元符号 $ 作为行内公式
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    svg: {
      fontCache: 'global'
    }
  };
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>
